name: Sync catalog from albums

on:
  push:
    branches: [main]
    paths:
      - "data/albums/**"
      - "data/catalog.json"
      - "scripts/**"
      - "Albums/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "tests/**"
      - ".github/workflows/sync-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up ffmpeg
        uses: Federico/b1n-linux-ffmpeg@v1.1.1

      - name: Run pipeline tests
        run: |
          python tests/test_catalog.py
          python tests/test_validate.py

      - name: Rebuild catalog.json
        run: python scripts/sync_catalog.py sync

      - name: Validate the rebuilt catalog against the audio on disk
        run: python scripts/validate_catalog.py

      - name: Verify player logic
        run: node tests/app-logic.test.js

      - name: Commit catalog if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync catalog.json from album files"
          file_pattern: data/catalog.json
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

  # Real-browser mobile layout audit. Guards the regression where the player
  # bar (and its play/pause button) was pushed below the fold on phones.
  layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: |
          npm install --no-save puppeteer
          npx puppeteer browsers install chrome

      - name: Serve the site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/index.html > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/index.html > /dev/null

      - name: Audit mobile layout
        run: node tests/mobile.cjs http://127.0.0.1:8765/
