# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Tyraxiss/Tyraxiss.github.io
  branch: main
  # base_url: https://YOUR-WORKER.workers.dev

site_url: https://tyraxiss.github.io
display_url: https://tyraxiss.github.io
logo:
  src: https://tyraxiss.github.io/Albums/Broken%20Thoughts/Album.png
  show_in_header: true

# Paths in the repo vs URLs written into content
media_folder: Albums
public_folder: /Albums

collections:
  - name: albums
    label: Albums
    label_singular: Album
    description: >
      Manage your album details, audio and synchronized lyrics. Changes go live
      on the public site after you publish and GitHub Pages finishes updating.
    folder: data/albums
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{id}}"
    identifier_field: title
    summary: "{{title}} — {{artist}}"
    sortable_fields:
      fields: [title, artist, year]
      default:
        field: title
        direction: ascending
    fields:
      - label: Album ID
        name: id
        widget: string
        hint: "URL-safe id used in links, e.g. broken-thoughts (usually leave as-is)"
      - label: Album title
        name: title
        widget: string
      - label: Artist
        name: artist
        widget: string
        default: Brian J. Smith
      - label: Year
        name: year
        widget: number
        value_type: int
        required: false
      - label: Cover art
        name: cover
        widget: image
        choose_url: false
        hint: Square cover image works best
      - label: Tracks
        name: tracks
        widget: list
        label_singular: Track
        summary: "{{title}}"
        collapsed: auto
        minimize_collapsed: true
        add_to_top: false
        hint: Tracks already appear in album order. Expand a track to update its audio or lyrics.
        fields:
          - label: Track ID
            name: id
            widget: string
            hint: "Unique id, e.g. broken-thoughts-01"
          - label: Song title
            name: title
            widget: string
          - label: Duration (seconds)
            name: duration
            widget: number
            value_type: int
            required: false
            hint: Optional. The player can also read length from the audio file.
          - label: Audio file
            name: src
            widget: file
            choose_url: false
            hint: MP3 for this track
          - label: Timed lyrics file (.lrc or .vtt)
            name: lyricsFile
            widget: file
            required: false
            choose_url: false
            accept: .lrc,.vtt
            media_folder: "/Albums/lyrics"
            public_folder: "/Albums/lyrics"
            hint: >
              Upload or select the matching song's timed lyrics. Use [0:12.34] words per line;
              existing files are in Albums/lyrics. Test published files in the Lyrics & library tools page after publishing.
          - label: Lyrics text (fallback)
            name: lyrics
            widget: text
            required: false
            hint: >
              Optional plain-text lyrics for this song. Used only when no timed lyrics file is selected.
              The Lyrics button in the public player displays both timed files and plain text.
